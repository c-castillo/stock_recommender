# next pins postcss to an exact vulnerable version (GHSA-qx2v-qp2m-jg93); this
# lifts its internal copy to the patched line.
overrides:
  postcss: '>=8.5.10'
allowBuilds:
  better-sqlite3: true
  bufferutil: false
  es5-ext: false
  esbuild: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: false
minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@0.112.1'
patchedDependencies:
  whatsapp-web.js@1.34.7: patches/whatsapp-web.js@1.34.7.patch
